<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Explainer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Code Explainer</h1>
            <p>Paste your code below to get a simple, step-by-step explanation.</p>
        </header>

        <main>
            <div class="api-key-section">
                <label for="apiKey">Groq API Key:</label>
                <input type="password" id="apiKey" placeholder="gsk_..." spellcheck="false" autocomplete="off">
                <p class="help-text">Your API key is only stored locally in your browser session.</p>
            </div>

            <div class="input-section">
                <textarea id="codeInput" placeholder="Paste your code here..." spellcheck="false"></textarea>
            </div>
            
            <div class="actions">
                <button id="explainBtn" class="primary-btn">
                    <span class="btn-text">Explain Code</span>
                    <span class="loader hidden"></span>
                </button>
            </div>

            <div id="errorMsg" class="error-msg hidden">Please enter some code to explain.</div>

            <div class="output-section hidden" id="outputContainer">
                <div class="output-header">
                    <h2>Explanation</h2>
                    <button id="copyBtn" class="icon-btn" aria-label="Copy output" title="Copy to clipboard">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                </div>
                <div id="explanationOutput" class="explanation-content"></div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
